<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CR~INDIA</title>
<style>
body{margin:0;background:#f2f4f8;font-family:Arial}
header{background:#101b35;color:white;padding:20px;text-align:center}
header h1{margin:0;color:white}
header span{color:#ff9933}
main{max-width:550px;margin:20px auto;padding:12px}
.stories,.post{background:white;padding:16px;border-radius:14px;margin-bottom:16px}
.stories{display:flex;justify-content:space-around;gap:12px}
.story{text-align:center;font-size:13px}
.circle{width:48px;height:48px;border-radius:50%;background:#e8edf8;border:3px solid #ff9933;display:grid;place-items:center;margin:auto auto 6px;font-size:22px}
.post img{width:100%;border-radius:10px;margin-top:12px}
button{padding:10px 14px;border:0;border-radius:20px;background:#e9eef8;margin:5px;cursor:pointer}
nav{position:fixed;bottom:0;left:0;width:100%;background:white;display:flex;justify-content:space-around;padding:15px 0}
nav button{background:white}
</style>
</head>
<body>
<header>
<h1>CR<span>~</span>INDIA 🇮🇳</h1>
<p>Connect India. Connect People.</p>
</header>
<main>
<section class="stories">
<div class="story"><div class="circle">＋</div>Your Story</div>
<div class="story"><div class="circle">👨</div>Rahul</div>
<div class="story"><div class="circle">👩</div>Priya</div>
<div class="story"><div class="circle">🧑</div>Arjun</div>
</section>
<article class="post">
<b>CR~INDIA Official</b>
<p>Discover the beauty of India! 🇮🇳</p>
<img src="https://images.unsplash.com/photo-1564507592333-c60657eea523?w=800" alt="Taj Mahal">
<button onclick="this.innerHTML='♥ Liked'">♡ Like</button>
<button onclick="alert('Comments coming soon!')">💬 Comment</button>
<button onclick="alert('Share coming soon!')">↗ Share</button>
</article>
</main>
<nav>
<button>🏠 Home</button>
<button>🔍 Explore</button>
<button>🎬 Reels</button>
<button>💬 Chat</button>
<button>👤 Profile</button>
</nav>
</body>
</html>
