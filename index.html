<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CR~INDIA</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:linear-gradient(135deg,#080510,#160b2d,#080510);
color:#f5edff;
font-family:Arial,sans-serif;
header{
background:linear-gradient(90deg,#25004d,#6900a8,#25004d);
color:white;
padding:22px;
text-align:center;
box-shadow:0 0 25px #a020f0;
}
header h2{margin:6px 0 0;font-size:12px;color:#ddd}
header p{margin:6px 0 0;font-size:12px;color:#ddd}
main{max-width:600px;margin:auto;padding:14px}
.card{
background:rgba(30,15,55,0.85);
color:#ffffff;
padding:16px;
border-radius:16px;
margin-bottom:14px;
border:1px solid #8735d8;
box-shadow:0 0 18px #7600bb55;
}
h3{margin-top:0}
textarea{width:100%;min-height:85px;border:1px solid #ddd;border-radius:10px;padding:12px;font:inherit;resize:vertical}
input[type=file]{width:100%;margin:12px 0}
button{
border:1px solid #b44aff;
border-radius:10px;
padding:11px 15px;
background:linear-gradient(135deg,#6500a8,#a020f0);
color:white;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 12px #a020f055;
}
.share{background:#13834b;width:100%}
.post img{width:100%;border-radius:10px;margin-top:10px}
.post-actions{display:flex;gap:10px;margin-top:12px}
.post-actions button
 .comments-list{
margin-top:12px;
padding:10px;
background:#160d27;
border:1px solid #8735d8;
border-radius:12px;
color:#f5edff;
}

.comments-list p{
padding:8px;
border-bottom:1px solid #49216d;
}{
background:linear-gradient(135deg,#6500a8,#a020f0);
color:white;
border:1px solid #c77dff;
box-shadow:0 0 12px #a020f066;
}
nav{
position:sticky;
bottom:0;
background:#10091d;
display:flex;
justify-content:space-around;
padding:13px 4px;
border-top:1px solid #8735d8;
box-shadow:0 0 18px #7600bb66;
}
nav button{
background:transparent;
color:#e8caff;
padding:8px;
font-size:12px;
border:0;
box-shadow:none;
}
.small{color:#687386;font-size:12px}
</style>
</head>
<body>
<header>
<h2>CR~INDIA 🇮🇳</h2>
<p>Connect India. Connect People.</p>
</header>

<main>
<section class="card">
<h3>➕ Create a Post</h3>
<textarea id="postText" placeholder="What's happening in India?"></textarea>
<input type="file" id="postImage" accept="image/*">
<button class="share" onclick="createPost()">Share Post</button>
</section>

<section class="card">
<h3>🌟 Stories</h3>
<p>🟠 Your Story　 🔵 Friends　 🟢 Explore</p>
</section>

<h3>🏠 Home Feed</h3>
<div id="feed">
<article class="card post">
<strong>CR~INDIA 🇮🇳</strong>
<p>Welcome to our Indian social community!</p>
<p class="small">A place to connect with people.</p>
<div class="post-actions">
<button onclick="likePost(this)">♡ Like</button>
<button onclick="commentPost()">💬 Comment</button>
<button onclick="sharePost()">↗️ Share</button> 
</div>
</article>
</div>
</main>

<nav>
<button onclick="window.scrollTo(0,0)">🏠 Home</button>
<button onclick="document.getElementById('postText').focus()">➕ Create</button>
<button onclick="alert('Explore coming soon!')">🔍 Explore</button>
<button onclick="alert('Chat coming soon!')">💬 Chat</button>
<button onclick="alert('Profile coming soon!')">👤 Profile</button>
</nav>

<script>
function createPost(){
 const text=document.getElementById('postText').value.trim();
 const file=document.getElementById('postImage').files[0];
 if(!text && !file){
  alert('Please write something or choose a photo.');
  return;
 }
 const post=document.createElement('article');
 post.className='card post';
 const heading=document.createElement('strong');
 heading.textContent='You 🇮🇳';
 post.appendChild(heading);

 if(text){
  const paragraph=document.createElement('p');
  paragraph.textContent=text;
  post.appendChild(paragraph);
 }

 if(file){
  const image=document.createElement('img');
  image.src=URL.createObjectURL(file);
  image.alt='Your post image';
  post.appendChild(image);
 }

 const actions=document.createElement('div');
 actions.className='post-actions';
 const like=document.createElement('button');
 like.textContent='♡ Like';
 like.onclick=function(){likePost(like)};
 const comment=document.createElement('button');
 comment.textContent='💬 Comment';
 comment.onclick=function(){alert('Comments feature coming soon!')};
 actions.append(like,comment);
 post.appendChild(actions);

 document.getElementById('feed').prepend(post);
 document.getElementById('postText').value='';
 document.getElementById('postImage').value='';
}
function likePost(button){
 if(button.textContent.includes('Liked')){
  button.textContent='♡ Like';
 }else{
  button.textContent='♥ Liked';
 }
}
</script>
 <div class="post-actions">
  <button onclick="likePost(this)">❤️ Like <span>0</span></button>
  <button onclick="commentPost()">💬 Comment</button>
  <button onclick="sharePost()">↗️ Share</button>
</div>

<script>
function likePost(button) {
  const count = button.querySelector("span");
  const liked = button.classList.toggle("liked");
  count.textContent = Number(count.textContent) + (liked ? 1 : -1);
}

 count.textContent = Number(count.textContent) + (liked ? 1 : -1);
}
function commentPost() {
  const comment = prompt("Write your comment:");

  if (comment && comment.trim()) {
    const post = document.querySelector(".post");
    let comments = post.querySelector(".comments-list");

    if (!comments) {
      comments = document.createElement("div");
      comments.className = "comments-list";
      post.appendChild(comments);
    }

    const item = document.createElement("p");
    item.textContent = "💬 " + comment.trim();
    comments.appendChild(item);
  }
}

function sharePost() {
  navigator.clipboard.writeText(window.location.href);
  alert("CR~INDIA link copied!");
}
</script>
 <script>
function commentPost() {
  const comment = prompt("Write your comment:");
  if (comment && comment.trim()) {
    alert("Comment added: " + comment);
  }
}

function sharePost() {
  if (navigator.share) {
    navigator.share({
      title: "CR~INDIA",
      text: "Welcome to Our Indian Social Community!",
      url: window.location.href
    });
  } else {
    navigator.clipboard.writeText(window.location.href);
    alert("Link copied!");
  }
}
</script>
</body>
 <script>
document.addEventListener("submit", function(e) {
  const form = e.target;

  const input = form.querySelector("textarea, input[type='text']");
  if (!input) return;

  const comment = input.value.trim();
  if (!comment) return;

  e.preventDefault();

  const post = form.closest(".post") || form.parentElement;

  let commentArea = post.querySelector(".cr-comments");

  if (!commentArea) {
    commentArea = document.createElement("div");
    commentArea.className = "cr-comments";
    commentArea.style.cssText =
      "margin-top:15px;padding:10px;color:white;";

    post.appendChild(commentArea);
  }

  const newComment = document.createElement("div");
  newComment.style.cssText =
    "padding:10px;margin-top:8px;background:#292044;border-radius:10px;color:white;";

  newComment.textContent = comment;

  commentArea.appendChild(newComment);

  input.value = "";
});
</script>
</html>
